<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Splitter | Tip Calculator</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/main.css" />
    <script type="module" src="assets/js/script.js"></script>
  </head>

  <body>
    <header class="header">
      <h1 class="logo">
        <span>SPLI</span>
        <span>TTER</span>
        <span class="visually-hidden">Splitter - Tip calculator</span>
      </h1>
    </header>

    <main class="calculator">
      <form id="tip-form" class="calculator__form" novalidate>
        <!-- Bill -->
        <div class="field">
          <div class="field__header">
            <label class="field__label" for="bill">Bill</label>
            <span
              class="field__error"
              id="bill-error"
              aria-live="polite"
            ></span>
          </div>
          <div class="input-wrapper">
            <span class="input-wrapper__icon" aria-hidden="true">$</span>
            <input
              class="input"
              type="number"
              id="bill"
              name="bill"
              placeholder="0"
              min="0"
              step="any"
              inputmode="decimal"
              aria-describedby="bill-error"
            />
          </div>
        </div>

        <!-- Tip selection -->
        <fieldset class="tip">
          <legend class="field__label">Select Tip %</legend>

          <div class="tip__options">
            <div class="tip__option">
              <input
                class="tip__radio"
                type="radio"
                id="tip-5"
                name="tip"
                value="5"
              />
              <label class="tip__label" for="tip-5">5%</label>
            </div>
            <div class="tip__option">
              <input
                class="tip__radio"
                type="radio"
                id="tip-10"
                name="tip"
                value="10"
              />
              <label class="tip__label" for="tip-10">10%</label>
            </div>
            <div class="tip__option">
              <input
                class="tip__radio"
                type="radio"
                id="tip-15"
                name="tip"
                value="15"
              />
              <label class="tip__label" for="tip-15">15%</label>
            </div>
            <div class="tip__option">
              <input
                class="tip__radio"
                type="radio"
                id="tip-25"
                name="tip"
                value="25"
              />
              <label class="tip__label" for="tip-25">25%</label>
            </div>
            <div class="tip__option">
              <input
                class="tip__radio"
                type="radio"
                id="tip-50"
                name="tip"
                value="50"
                checked
              />
              <label class="tip__label" for="tip-50">50%</label>
            </div>
            <div class="tip__option">
              <label class="visually-hidden" for="tip-custom"
                >Custom tip percentage</label
              >
              <input
                class="input input--custom"
                type="number"
                id="tip-custom"
                name="tip-custom"
                placeholder="Custom"
                min="0"
                step="any"
                inputmode="decimal"
              />
            </div>
          </div>
        </fieldset>

        <!-- Number of people -->
        <div class="field">
          <div class="field__header">
            <label class="field__label" for="people">Number of People</label>
            <span
              class="field__error"
              id="people-error"
              aria-live="polite"
            ></span>
          </div>
          <div class="input-wrapper">
            <svg
              class="input-wrapper__icon"
              width="13"
              height="16"
              viewBox="0 0 13 16"
              fill="currentColor"
              aria-hidden="true"
              focusable="false"
            >
              <circle cx="6.5" cy="3.75" r="3.75" />
              <path d="M0 14.5C0 11.5 2.5 9.5 6.5 9.5S13 11.5 13 14.5V16H0z" />
            </svg>
            <input
              class="input"
              type="number"
              id="people"
              name="people"
              placeholder="0"
              min="1"
              step="1"
              inputmode="numeric"
              aria-describedby="people-error"
            />
          </div>
        </div>

        <!-- Results -->
        <section class="results" aria-labelledby="results-title">
          <h2 class="visually-hidden" id="results-title">Results</h2>

          <div class="results__row">
            <div class="results__text">
              <p class="results__title" id="tip-amount-label">Tip Amount</p>
              <p class="results__subtitle">/ person</p>
            </div>
            <output
              class="results__value"
              id="tip-amount"
              for="bill tip-5 tip-10 tip-15 tip-25 tip-50 tip-custom people"
              aria-labelledby="tip-amount-label"
              >$0.00</output
            >
          </div>

          <div class="results__row">
            <div class="results__text">
              <p class="results__title" id="total-label">Total</p>
              <p class="results__subtitle">/ person</p>
            </div>
            <output
              class="results__value"
              id="total"
              for="bill tip-5 tip-10 tip-15 tip-25 tip-50 tip-custom people"
              aria-labelledby="total-label"
              >$0.00</output
            >
          </div>

          <button class="results__reset" type="reset" id="reset">Reset</button>
        </section>
      </form>
    </main>
  </body>
</html>
